# ── Bob HQ Dashboard — HTTPS :443 ──────────────────────────────────
server {
    listen 443 ssl;
    server_name 20.89.63.64;

    ssl_certificate     /etc/nginx/ssl/bob.crt;
    ssl_certificate_key /etc/nginx/ssl/bob.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # HQ dashboard (default)
    location / {
        proxy_pass         http://127.0.0.1:44283;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection 'upgrade';
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }

    # SSE — disable buffering so events stream live
    location /api/events {
        proxy_pass         http://127.0.0.1:44283/api/events;
        proxy_http_version 1.1;
        proxy_set_header   Connection '';
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;
    }

    location /api/ {
        proxy_pass         http://127.0.0.1:44283;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }
}

# ── Bob Harness API — HTTPS :44286 ─────────────────────────────────
